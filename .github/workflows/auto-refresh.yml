name: Auto-refresh content

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/auto-refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch videos & headlines, rebuild site
        run: python3 scripts/refresh.py
      - name: Commit changes
        run: |
          git config user.name  "people-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"; echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore: auto-refresh videos, headlines and pages"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi
      - name: Trigger GitHub Pages rebuild
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
